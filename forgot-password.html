<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover Password | I-Record</title>
    <link rel="icon" type="image/jpeg" href="assets/img/ovpre-logo.jpg?v=20261105-logo">
    <link rel="stylesheet" href="assets/css/style.css?v=20261015-simple-login-background">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="login-body">
    <main class="login-shell">
        <section class="login-card" style="width: min(100%, 450px); padding: 34px;">
            <div class="login-logo" style="text-align: center; margin-bottom: 12px;">
                <img src="assets/img/ovpre-logo.jpg" alt="OVPRE Logo" style="width: 58px; height: 58px; border-radius: 50%;">
            </div>
            <div class="login-copy" style="text-align: center; margin-bottom: 20px;">
                <p style="margin: 0; font-size: 0.8rem; font-weight: 700; color: #15803d; text-transform: uppercase;">OVPRE Security Gateway</p>
                <h1 style="margin: 4px 0 6px; font-size: 1.45rem; font-weight: 800; color: #0f172a;">Password Recovery</h1>
                <small style="color: #64748b;">Enter your institutional email to receive recovery instructions.</small>
            </div>

            <div id="recoveryNotice" style="display: none; padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 0.88rem; align-items: center; gap: 8px; background: #f0fdf4; border: 1px solid #86efac; color: #166534;">
                <i class="ri-checkbox-circle-line"></i> Recovery link sent! Check your institutional email inbox.
            </div>

            <form id="recoveryForm" onsubmit="handleRecovery(event)" style="display: flex; flex-direction: column; gap: 14px;">
                <div>
                    <label for="recoveryEmail" style="display: block; font-size: 0.85rem; font-weight: 700; color: #334155; margin-bottom: 6px;">Institutional Email</label>
                    <div class="input-control" style="position: relative;">
                        <input type="email" id="recoveryEmail" required placeholder="name@plsp.edu.ph" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 0.9rem;">
                    </div>
                </div>

                <button class="primary-btn full-btn" type="submit" id="recoveryBtn" style="padding: 12px; border-radius: 10px; background: #15803d; color: #ffffff; font-weight: 700; border: none; cursor: pointer; font-size: 0.95rem; margin-top: 6px;">
                    <i class="ri-mail-send-line"></i> Send Recovery Instructions
                </button>

                <div style="text-align: center; margin-top: 14px;">
                    <a href="login.html" style="color: #15803d; font-size: 0.88rem; font-weight: 700; text-decoration: none; display: inline-flex; align-items: center; gap: 5px;">
                        <i class="ri-arrow-left-line"></i> Back to Sign In
                    </a>
                </div>
            </form>
        </section>
    </main>

    <script>
        function handleRecovery(e) {
            e.preventDefault();
            const btn = document.getElementById('recoveryBtn');
            const notice = document.getElementById('recoveryNotice');
            btn.disabled = true;
            btn.innerHTML = '<i class="ri-loader-4-line ri-spin"></i> Sending link...';
            setTimeout(() => {
                notice.style.display = 'flex';
                btn.innerHTML = '<i class="ri-check-line"></i> Instructions Sent';
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
            }, 800);
        }
    </script>
</body>
</html>
